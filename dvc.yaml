# DVC Pipeline Configuration

stages:
  preprocess_data:
    cmd: python src/data_preprocessing.py
    deps:
      - src/data_preprocessing.py
      - data/raw
    outs:
      - data/processed:
          cache: false
    metrics:
      - data/processed/data_stats.json:
          cache: false

  train_model:
    cmd: python src/train.py
    deps:
      - src/train.py
      - src/model.py
      - data/processed
      - config/config.yaml
    outs:
      - models/best_model.h5
    metrics:
      - models/metrics.json:
          cache: false
    plots:
      - models/confusion_matrix.csv:
          x: predicted
          y: actual

  evaluate_model:
    cmd: python src/inference.py
    deps:
      - src/inference.py
      - models/best_model.h5
      - data/processed
    metrics:
      - models/evaluation_metrics.json:
          cache: false
